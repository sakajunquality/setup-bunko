name: Setup bunko
description: Install Bun and a checksum- and provenance-verified bunko CLI on Linux and macOS
branding:
  icon: download
  color: purple
inputs:
  version:
    description: Full bunko CLI release version, independent of the Action version
    default: 'v0.6.2'
  bun-version:
    description: Bun runtime version (default CLI supports >=1.3.13 and <1.5)
    default: 1.4.2
  repository:
    description: GitHub repository hosting the release
    default: sakajunquality/bunko
  token:
    description: Token with read access to the release repository
    default: ${{ github.token }}
  source-commit:
    description: Optional full source commit digest to constrain attestation verification
  verify-attestation:
    description: Verify signed provenance and version-tag identity before executing the CLI (requires gh and an attested release)
    default: 'true'
  distribution-directory:
    description: Optional pre-downloaded directory containing bunko.js, notices, and SHA256SUMS
outputs:
  version:
    description: Installed bunko CLI version without the v prefix
    value: ${{ steps.install.outputs.version }}
  bunko-path:
    description: Absolute path to the bunko executable
    value: ${{ steps.install.outputs.bunko-path }}
runs:
  using: composite
  steps:
    - id: install
      uses: sakajunquality/bunko@ab6d35eb7c39369b1c2491c4b94c20e656b4548b # v0.6.2
      with:
        version: ${{ inputs.version }}
        bun-version: ${{ inputs.bun-version }}
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        source-commit: ${{ inputs.source-commit }}
        verify-attestation: ${{ inputs.verify-attestation }}
        distribution-directory: ${{ inputs.distribution-directory }}
