name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: [1.3.13, 1.4.2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install default release with provenance verification
        id: default
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
      - name: Check default outputs and PATH
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.default.outputs.version }}
          EXECUTABLE: ${{ steps.default.outputs.bunko-path }}
          EXPECTED_BUN: ${{ matrix.bun }}
        run: |
          test "$INSTALLED_VERSION" = 0.12.0
          test "$(bunko version)" = "$INSTALLED_VERSION"
          test "$("$EXECUTABLE" version)" = "$INSTALLED_VERSION"
          test "$(bun --version)" = "$EXPECTED_BUN"
      - name: Install latest stable release with provenance verification
        id: latest
        uses: ./
        with:
          version: latest
          bun-version: ${{ matrix.bun }}
      - name: Check resolved latest outputs
        env:
          INSTALLED_VERSION: ${{ steps.latest.outputs.version }}
          EXECUTABLE: ${{ steps.latest.outputs.bunko-path }}
        run: |
          test "$INSTALLED_VERSION" != latest
          test "$(bunko version)" = "$INSTALLED_VERSION"
          test "$("$EXECUTABLE" version)" = "$INSTALLED_VERSION"
      - name: Check wrapper contract
        run: bun scripts/check-contract.ts
      - name: Install explicit older release
        id: override
        uses: ./
        with:
          version: v0.6.1
          bun-version: ${{ matrix.bun }}
          source-commit: 965bbce218c935e29cfb2d87e00b733dbcbf86b1
      - name: Check explicit version
        env:
          INSTALLED_VERSION: ${{ steps.override.outputs.version }}
        run: |
          test "$INSTALLED_VERSION" = 0.6.1
          test "$(bunko version)" = 0.6.1
      - name: Reject incorrect source identity
        id: wrong-source
        continue-on-error: true
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
          source-commit: 965bbce218c935e29cfb2d87e00b733dbcbf86b1
      - name: Verify rejection
        env:
          OUTCOME: ${{ steps.wrong-source.outcome }}
        run: test "$OUTCOME" = failure
      - name: Reject incorrect source identity for latest
        id: latest-wrong-source
        continue-on-error: true
        uses: ./
        with:
          version: latest
          bun-version: ${{ matrix.bun }}
          source-commit: 965bbce218c935e29cfb2d87e00b733dbcbf86b1
      - name: Verify latest source rejection
        env:
          OUTCOME: ${{ steps.latest-wrong-source.outcome }}
        run: test "$OUTCOME" = failure
      - name: Download local distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.12.0 --repo sakajunquality/bunko --dir "$RUNNER_TEMP/distribution"
      - name: Install local distribution
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
          distribution-directory: ${{ runner.temp }}/distribution
          source-commit: 77b4116069e1853439ca1b2e00a8e7d2a0aa00e0
      - name: Reject latest with a local distribution
        id: latest-local
        continue-on-error: true
        uses: ./
        with:
          version: latest
          bun-version: ${{ matrix.bun }}
          distribution-directory: ${{ runner.temp }}/distribution
      - name: Verify ambiguous local version rejection
        env:
          OUTCOME: ${{ steps.latest-local.outcome }}
        run: test "$OUTCOME" = failure
      - name: Prepare distribution without provenance
        run: |
          cp -R "$RUNNER_TEMP/distribution" "$RUNNER_TEMP/checksum-only"
          rm "$RUNNER_TEMP/checksum-only/PROVENANCE.jsonl"
      - name: Reject missing provenance by default
        id: missing-provenance
        continue-on-error: true
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
          distribution-directory: ${{ runner.temp }}/checksum-only
      - name: Verify missing provenance rejection
        env:
          OUTCOME: ${{ steps.missing-provenance.outcome }}
        run: test "$OUTCOME" = failure
      - name: Install with checksum verification only
        id: checksum-only
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
          distribution-directory: ${{ runner.temp }}/checksum-only
          verify-attestation: 'false'
      - name: Verify checksum-only installation
        env:
          INSTALLED_VERSION: ${{ steps.checksum-only.outputs.version }}
        run: |
          test "$INSTALLED_VERSION" = 0.12.0
          test "$(bunko version)" = 0.12.0
      - name: Corrupt local payload
        run: printf '\n' >> "$RUNNER_TEMP/distribution/bunko.js"
      - name: Reject corrupt distribution
        id: corrupt
        continue-on-error: true
        uses: ./
        with:
          bun-version: ${{ matrix.bun }}
          distribution-directory: ${{ runner.temp }}/distribution
      - name: Verify checksum rejection
        env:
          OUTCOME: ${{ steps.corrupt.outcome }}
        run: test "$OUTCOME" = failure
  required:
    name: Consumer tests
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
